name: Publish NuGet

# Versioning is driven by MinVer (git tags):
#   - Push to master           -> preview build, version like `0.2.1-alpha.0.42` (commit height)
#   - Tag `v1.2.3` -> release  -> version `1.2.3`
#   - Manual dispatch          -> whatever the current branch/tag produces
# Both packages (SharpInference + SharpInference.Cli) ship from the same job.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and push
    # windows-latest (not ubuntu) so the native AVX-512-VNNI helper
    # (native/cpu_vnni/q8k_vnni.c → sharpi_cpu_vnni.dll, built by build-vnni.ps1 with
    # clang-cl) is produced and packed into the win-x64 native runtime asset. The
    # runner ships LLVM + VS 2022 + the Windows SDK, which build-vnni.ps1 auto-discovers.
    # The managed packages are RID-agnostic; only the native DLL is win-x64-specific.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # MinVer needs the full history and all tags to compute version + commit height.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Build the VNNI DLL explicitly (also runs via the csproj BeforeBuild target during
      # pack, but doing it here makes success/failure visible in the logs). Non-fatal:
      # if the toolchain is unavailable the script exits 0 and the package omits the DLL
      # (consumers fall back to the managed AVX2 path), so the release never breaks.
      - name: Build native VNNI DLL
        shell: pwsh
        run: |
          ./scripts/build-vnni.ps1
          if (Test-Path native/cpu_vnni/sharpi_cpu_vnni.dll) {
            Write-Host "::notice::sharpi_cpu_vnni.dll built — VNNI path will ship in the win-x64 native asset."
          } else {
            Write-Host "::warning::sharpi_cpu_vnni.dll NOT built — package ships without VNNI (AVX2 fallback)."
          }

      - name: Pack
        run: dotnet pack -c Release -o ./artifacts/nupkg

      - name: List packages
        run: ls -la ./artifacts/nupkg

      - name: Push to nuget.org
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        # --skip-duplicate makes re-runs safe (idempotent on the same version).
        # The same command pushes both .nupkg files; matching .snupkg symbol packages
        # are auto-uploaded alongside.
        run: >
          dotnet nuget push './artifacts/nupkg/*.nupkg'
          --api-key "$NUGET_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
